<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>금융 상담 Agent · 확인 화면</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>금융 상담 Agent <span>확인 화면</span></h1>
    <div id="status" class="pills"></div>
  </header>

  <nav id="tabs">
    <button data-tab="search" class="active">검색</button>
    <button data-tab="chunks">청크</button>
    <button data-tab="check">일괄 확인</button>
    <button data-tab="chat">채팅</button>
    <button data-tab="calc">이자 계산</button>
  </nav>

  <div id="settings">
    <label>검색 방식
      <select id="mode">
        <option value="dense">벡터</option>
        <option value="bm25">키워드 (BM25)</option>
        <option value="hybrid">하이브리드 (벡터 + BM25)</option>
      </select>
    </label>
    <label>리랭킹
      <select id="rerank">
        <option value="none">없음</option>
        <option value="cross">교차 인코더 (bge-reranker)</option>
        <option value="llm">LLM (느림)</option>
      </select>
    </label>
    <span id="settings-note" class="muted"></span>
  </div>

  <main>
    <section id="tab-search">
      <form id="search-form">
        <input id="q" type="text" placeholder="질문을 입력하세요. 예: 중도해지하면 이자 얼마 받아요?" autocomplete="off" required>
        <button type="submit">검색</button>
      </form>
      <div class="filters">
        <label>상품 <select id="product"><option value="">전체</option></select></label>
        <label>청크 종류 <select id="ctype"><option value="">전체</option></select></label>
        <label>개수 <input id="k" type="number" min="1" max="20" value="5"></label>
      </div>
      <div id="examples" class="chips"></div>
      <div id="search-msg" class="msg"></div>
      <div id="results"></div>
    </section>

    <section id="tab-chunks" hidden>
      <div class="filters">
        <label>검색어 <input id="cq" type="text" placeholder="본문 · 조항 · id"></label>
        <label>문서 <select id="cdoc"><option value="">전체</option></select></label>
        <label>청크 종류 <select id="ctype2"><option value="">전체</option></select></label>
        <span id="ctotal" class="muted"></span>
      </div>
      <div class="split">
        <ul id="chunk-list"></ul>
        <article id="chunk-detail"><p class="muted">왼쪽에서 청크를 고르면 메타데이터와 본문이 보입니다.</p></article>
      </div>
    </section>

    <section id="tab-check" hidden>
      <div class="filters">
        <label>상위 <input id="ck" type="number" min="1" max="20" value="5"> 개까지 확인</label>
        <button id="run-check">질문 일괄 실행</button>
      </div>
      <div id="check-msg" class="msg"></div>
      <div id="check-summary"></div>
      <div id="check-table"></div>
    </section>

    <section id="tab-chat" hidden>
      <div id="chat-log"><p class="muted">약관에 대해 물어보세요. 근거 카드가 먼저 나타나고, 이어서 답변이 생성되는 대로 흘러나옵니다.</p></div>
      <form id="chat-form">
        <input id="chat-q" type="text" placeholder="예: 만기 전에 해지하면 이율이 어떻게 돼요?" autocomplete="off" required>
        <button type="submit" id="chat-send">보내기</button>
        <button type="button" id="chat-stop" class="secondary" hidden>중지</button>
      </form>
      <p class="muted small">지금은 약관 근거로 규칙만 설명합니다 (이자 계산은 4~7일차에 도구로 연결). 답변은 참고용이니 아래 근거 카드를 함께 확인하세요.</p>
    </section>

    <section id="tab-calc" hidden>
      <p class="muted">중도해지 이자 계산 도구를 직접 시험합니다. 계산은 모델이 아니라 코드가 하고, 사용한 가정을 결과와 함께 보여줍니다. 세전 기준입니다.</p>
      <div id="calc-cases" class="chips"></div>
      <form id="calc-form" class="calc-grid">
        <label>원금 (원) <input id="c-principal" type="text" placeholder="10000000" autocomplete="off"></label>
        <label>신규일 <input id="c-start" type="date"></label>
        <label>만기일 <input id="c-maturity" type="date"></label>
        <label>해지일 <input id="c-termination" type="date"></label>
        <label>기본금리 (%) <input id="c-base" type="text" placeholder="경과 6개월 이상일 때만" autocomplete="off"></label>
        <button type="submit">계산</button>
      </form>
      <div id="calc-result"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
