<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>정기예금 상담</title>
<link rel="stylesheet" href="/static/service.css">
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand">정기예금 상담</span>
    <button type="button" id="reset" class="plain">새 대화</button>
  </header>
  <div class="tabs" role="tablist" aria-label="메뉴">
    <button type="button" role="tab" id="tab-chat" aria-selected="true" aria-controls="panel-chat">상담</button>
    <button type="button" role="tab" id="tab-calc" aria-selected="false" aria-controls="panel-calc">이자 계산</button>
  </div>

  <section id="panel-chat" role="tabpanel" aria-labelledby="tab-chat">
    <div id="messages" class="messages" aria-live="polite">
      <div id="faq" class="faq">
        <p class="faq-title">무엇이 궁금하세요?</p>
        <button type="button" class="faq-item" data-q="중도해지하면 이자는 어떻게 계산돼요?">중도해지하면 이자는 어떻게 계산돼요?</button>
        <button type="button" class="faq-item" data-q="일부해지는 몇 번까지 할 수 있어요?">일부해지는 몇 번까지 할 수 있어요?</button>
        <button type="button" class="faq-item" data-q="세금이 붙나요?">세금이 붙나요?</button>
        <button type="button" class="faq-item" data-q="예금자보호가 되나요?">예금자보호가 되나요?</button>
      </div>
    </div>
    <form id="chat-form" class="composer" autocomplete="off">
      <input id="question" name="question" type="text" maxlength="2000" placeholder="궁금한 점을 입력하세요" aria-label="질문">
      <button type="submit" class="primary">보내기</button>
    </form>
  </section>

  <section id="panel-calc" role="tabpanel" aria-labelledby="tab-calc" hidden>
    <form id="calc-form" class="form" autocomplete="off" novalidate>
      <div class="field">
        <label for="principal">원금</label>
        <div class="unit"><input id="principal" name="principal" type="text" inputmode="numeric" placeholder="10,000,000"><span>원</span></div>
      </div>
      <div class="row">
        <div class="field"><label for="start_date">신규일</label><input id="start_date" name="start_date" type="date"></div>
        <div class="field"><label for="maturity_date">만기일</label><input id="maturity_date" name="maturity_date" type="date"></div>
      </div>
      <div class="field"><label for="termination_date">해지일</label><input id="termination_date" name="termination_date" type="date"></div>
      <div class="field">
        <label for="base_rate">신규일 당시 기본금리 (연 %)</label>
        <div class="unit"><input id="base_rate" name="base_rate" type="text" inputmode="decimal" placeholder="3.5"><span>%</span></div>
        <p class="help">가입한 지 6개월이 지났을 때만 필요해요.</p>
      </div>
      <button type="submit" class="primary wide">계산하기</button>
    </form>
    <div id="calc-result" class="result" aria-live="polite"></div>
  </section>

  <footer class="note">실제 금융 상담이 아니며 참고용입니다.<br>실제 이자는 은행의 해지예상조회로 확인해 주세요.</footer>
</div>
<script src="/static/service.js"></script>
</body>
</html>
